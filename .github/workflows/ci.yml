name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref; the eval spend in evals.yml makes stacked
# runs genuinely expensive, and consistency across workflows keeps that predictable.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must precede setup-node: the pnpm store cache below needs pnpm on PATH.
      # Version is read from the "packageManager" field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Runs first: a leaked name should fail before any other signal competes for
      # attention in the log.
      #
      # SCOPE — read before treating a green check here as assurance:
      # this enforces STRUCTURAL PATTERNS ONLY (email addresses, US phone numbers).
      # The literal-term half of the check reads .denylist.local, which is gitignored
      # by design and therefore absent on a runner. CI cannot and will not catch a real
      # name in a diff. That gate exists only in the local pre-commit hook, and the
      # durable control is human review of every diff touching prose.
      # See the header of scripts/check-denylist.mjs.
      - name: Denylist (structural patterns only)
        run: node scripts/check-denylist.mjs --all

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # The two specs that make plan §5 non-negotiables 4 and 5 controls rather than
      # config: security headers asserted on a live response, and capture after a hard
      # reload with the network gone. Until 2026-09-09 nothing ran them but a person,
      # which is the case CLAUDE.md names as worse than an untested control. One
      # browser, because the Playwright config declares one project. The suite starts
      # the server from the build the step above just made (see playwright.config.ts);
      # this step must stay after Build.
      #
      # What a green run still does not say: the suite runs on 127.0.0.1, a secure
      # context, so it enters no environment that needs a trusted certificate
      # authority, a home-screen install, or seven days of Safari's eviction window.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e
