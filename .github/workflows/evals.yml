name: Evals

# Adversarial guardrail suite (PROJECT-PLAN §4.5). Runs against live prompts and costs
# real API spend, so it is deliberately NOT on push. Pull requests and manual dispatch
# only.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evals:
    name: Adversarial guardrail suite
    runs-on: ubuntu-latest

    # Secrets are not exposed to pull_request runs from a fork. Without this guard the
    # job would run keyless and fail in a way that looks like a guardrail regression
    # rather than a missing credential. Fork PRs touching prompts or guardrails must be
    # re-run via workflow_dispatch from a branch in this repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # No continue-on-error and no `|| true`: a weakened guardrail must fail the build.
      # A PR that lowers a pass rate should not be mergeable on a green check.
      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm evals
