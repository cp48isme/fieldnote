<!--
  Fieldnote app icon. Deliberately abstract: a card with lines on it, which is what the
  app holds. No manufacturer mark, no product, no wordmark — see ADR-0001.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Fieldnote">
  <rect width="512" height="512" rx="112" fill="#1e293b" />
  <rect x="136" y="112" width="240" height="288" rx="24" fill="#f8fafc" />
  <g fill="#1e293b">
    <rect x="176" y="168" width="160" height="20" rx="10" />
    <rect x="176" y="224" width="160" height="20" rx="10" />
    <rect x="176" y="280" width="96" height="20" rx="10" />
  </g>
</svg>
